<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Substack Panel</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
    --s1: #2a78d6; --s1-wash: rgba(42,120,214,.10); --s2: #eb6834; --s3: #1baf7a;
    --good: #006300; --bad: #d03b3b; --accent: #ff6719; --hover: rgba(11,11,11,.04);
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
      --s1: #3987e5; --s1-wash: rgba(57,135,229,.12); --s2: #d95926; --s3: #199e70;
      --good: #0ca30c; --bad: #e66767; --hover: rgba(255,255,255,.05);
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 20px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  header h1 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  .tab { border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); padding: 6px 12px; border-radius: 999px; cursor: pointer; font: inherit; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 16px; }
  .filters .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .filters .seg button { border: 0; background: transparent; color: var(--ink-2); padding: 6px 10px; font: inherit; cursor: pointer; }
  .filters .seg button[aria-pressed="true"] { background: var(--hover); color: var(--ink); font-weight: 600; }
  .filters input[type=search] { border: 1px solid var(--border); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 10px; font: inherit; min-width: 220px; }
  .filters .spacer { flex: 1; }
  .filters .meta { color: var(--muted); font-size: 12px; }
  .grid { display: grid; gap: 12px; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .tile .label { color: var(--ink-2); font-size: 12px; }
  .tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; letter-spacing: -.01em; }
  .tile.hero .value { font-size: 48px; line-height: 1.05; }
  .tile .delta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .delta.up { color: var(--good); } .delta.down { color: var(--bad); }
  .charts { grid-template-columns: 2fr 1fr; margin-bottom: 12px; }
  .charts .wide { grid-column: 1 / -1; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
  .card h2 { font-size: 14px; margin: 0 0 2px; font-weight: 600; }
  .card .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .card .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .card .head button:not(.seg button) { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline; }
  svg { display: block; width: 100%; overflow: visible; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .axis-line { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .line { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .area { fill: var(--s1-wash); }
  .bar { fill: var(--s1); } .bar.dim { fill: var(--s1); opacity: .35; } .bar.hi { fill: var(--s2); }
  .hit { fill: transparent; cursor: pointer; }
  .dot { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .crosshair { stroke: var(--axis); stroke-width: 1; }
  .dlabel { fill: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; }
  .tooltip { position: fixed; pointer-events: none; z-index: 10; background: var(--ink); color: var(--page); padding: 6px 9px; border-radius: 6px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.2); max-width: 300px; }
  .tooltip b { display: block; margin-bottom: 2px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-2); font-size: 12px; margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th:first-child, td:first-child, th.t, td.t { text-align: left; }
  th { color: var(--ink-2); font-weight: 500; font-size: 12px; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
  th[aria-sort="descending"]::after { content: " ↓"; } th[aria-sort="ascending"]::after { content: " ↑"; }
  tbody tr { cursor: pointer; } tbody tr:hover { background: var(--hover); }
  td.t { white-space: normal; min-width: 260px; }
  td.t .title { font-weight: 500; } td.t .date { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--hover); color: var(--ink-2); margin-left: 6px; }
  .vs { font-size: 12px; } .vs.up { color: var(--good); } .vs.down { color: var(--bad); }
  .tablewrap { overflow-x: auto; }
  tbody tr.detailrow { cursor: default; background: var(--page); }
  tbody tr.detailrow:hover { background: var(--page); }
  .detailrow > td { padding: 0; text-align: left; white-space: normal; border-bottom: 1px solid var(--grid); }
  .detailbox { padding: 20px 22px 24px; }
  .detailrow .dstat { background: var(--surface); }
  tbody tr.selected { background: var(--hover); }
  tbody tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--s1); }
  .dhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
  .dhead h3 { margin: 0 0 4px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
  .dhead h3 a { text-decoration: none; } .dhead h3 a:hover { text-decoration: underline; }
  .dhead .sub { color: var(--muted); font-size: 12px; }
  .dhead .btn { flex: none; padding: 5px 12px; font-size: 12px; }
  .dstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .dstat { background: var(--page); border-radius: 10px; padding: 11px 13px; }
  .dstat .l { font-size: 11px; color: var(--ink-2); }
  .dstat .v { font-size: 21px; font-weight: 600; letter-spacing: -.01em; margin-top: 3px; }
  .dstat .n { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
  .dcaption { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 18px 0 9px; }
  .dsep { border: 0; border-top: 1px solid var(--grid); margin: 22px 0 18px; }
  .dcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 30px; }
  .dcols h4 { margin: 0 0 12px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .srcrow { margin-bottom: 11px; }
  .srcrow .t { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; margin-bottom: 5px; }
  .srcrow .t span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .srcbar { height: 5px; border-radius: 3px; background: var(--grid); }
  .srcbar i { display: block; height: 100%; border-radius: 3px; background: var(--s1); }
  .linkrow { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
  .linkrow span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .linkrow span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dempty { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
  .sr { position: absolute; left: -9999px; }
  .credit { margin: 28px 0 0; text-align: center; font-size: 11px; color: var(--muted); }
  .credit a { color: inherit; }
  .relnote { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--s1); border-radius: 8px; padding: 9px 13px; margin: 0 0 12px; font-size: 12px; color: var(--ink-2); }
  .btn { border: 1px solid var(--border); background: var(--surface); color: var(--ink); padding: 6px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn[disabled] { opacity: .6; cursor: default; }
  .cmp-charts { grid-template-columns: repeat(3, 1fr); margin-bottom: 12px; }
  @media (max-width: 900px) { .cmp-charts { grid-template-columns: 1fr; } }
  .pubdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .cmp-table td.t { min-width: 180px; }
  .cmp-table tbody tr { cursor: pointer; }
  .top-list { list-style: none; margin: 0; padding: 0; }
  .top-list li { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--grid); }
  .top-list .rank { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .top-list .pt { font-weight: 500; } .top-list .pm { color: var(--muted); font-size: 12px; }
  .top-list .pv { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .top-list .pv small { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span data-i18n="title"></span> <small id="who"></small></h1>
    <div class="tabs" role="tablist" id="tabs"></div>
  </header>

  <div class="filters">
    <div class="seg" id="range" role="group" data-i18n-aria="rangeLabel">
      <button data-days="0" aria-pressed="true" data-i18n="all"></button>
      <button data-days="365" data-i18n="d365"></button>
      <button data-days="90" data-i18n="d90"></button>
      <button data-days="30" data-i18n="d30"></button>
    </div>
    <div class="seg" id="mode" role="group" data-i18n-aria="modeLabel">
      <button data-mode="abs" aria-pressed="true" data-i18n="absolute"></button>
      <button data-mode="rel" aria-pressed="false" data-i18n="relative"></button>
    </div>
    <input type="search" id="q" data-i18n-ph="searchPosts">
    <div class="spacer"></div>
    <div class="meta" id="meta"></div>
  </div>
  <div class="relnote" id="relnote" data-i18n="relNote" hidden></div>

  <div id="compare" hidden>
    <div class="grid tiles" id="cmp-tiles"></div>
    <div class="card" style="margin-bottom:12px">
      <div class="head"><div><h2 data-i18n="publications"></h2><div class="sub" id="cmp-sub"></div></div></div>
      <div class="legend" id="cmp-legend"></div>
      <div class="tablewrap"><table id="cmp-table" class="cmp-table"><thead></thead><tbody></tbody></table></div>
    </div>
    <div class="grid cmp-charts">
      <div class="card"><div class="head"><div><h2 data-i18n="subscribers"></h2><div class="sub" data-i18n="subsPerPub"></div></div></div><div id="cmp-subs"></div></div>
      <div class="card"><div class="head"><div><h2 id="cmp-views-h"></h2><div class="sub" id="cmp-views-sub"></div></div></div><div id="cmp-views"></div></div>
      <div class="card"><div class="head"><div><h2 data-i18n="openRate"></h2><div class="sub" data-i18n="openRateSub"></div></div></div><div id="cmp-open"></div></div>
    </div>
    <div class="card">
      <div class="head"><div><h2 data-i18n="bestPosts"></h2><div class="sub" id="cmp-top-sub"></div></div>
        <div class="seg" id="cmp-top-metric"><button data-m="views" aria-pressed="true" data-i18n="mViews"></button><button data-m="open_rate" data-i18n="mOpen"></button><button data-m="reactions" data-i18n="mReactions"></button><button data-m="signups" data-i18n="mSignups"></button></div></div>
      <ol class="top-list" id="cmp-top"></ol>
    </div>
  </div>

  <div id="pubview">
  <div class="grid tiles" id="tiles"></div>

  <div class="grid charts">
    <div class="card"><div class="head"><div><h2 data-i18n="subscribers"></h2><div class="sub" id="subs-sub"></div></div><button id="subs-table-btn"></button></div><div id="subs-chart"></div><div id="subs-table" hidden></div></div>
    <div class="card"><div class="head"><div><h2 data-i18n="growthSources"></h2><div class="sub" data-i18n="growthSourcesSub"></div></div></div><div id="sources-chart"></div></div>
    <div class="card wide"><div class="head"><div><h2 data-i18n="viewsPerPost"></h2><div class="sub" id="views-sub"></div></div></div><div id="views-chart"></div><div class="legend" id="views-legend"></div></div>
  </div>

  <div class="card">
    <div class="head"><div><h2 data-i18n="posts"></h2><div class="sub" id="posts-sub"></div></div></div>
    <div class="tablewrap"><table id="posts"><thead></thead><tbody></tbody></table></div>
  </div>
  </div><!-- /pubview -->
  <footer class="credit"><span data-i18n="creditPre"></span> <a href="https://github.com/polmarza/substack-dashboard" target="_blank" rel="noopener">Substack Dashboard</a><span data-i18n="creditPost"></span></footer>
</div>
<div class="tooltip" id="tip" hidden></div>
<script id="data" type="application/json">/*__DATA__*/null</script>

  // barras horizontales con color fijo por publicación

  function renderTop() {

  function tile(label, value, delta, cls = '') {
    return `<div class="card tile ${cls}"><div class="label">${label}</div><div class="value">${value}</div>${delta ? `<div class="delta ${delta.cls || ''}">${delta.text}</div>` : ''}</div>`;
  }
  function deltaOf(now, before, suffix = '') {

    return { text: T.vsPrev30(`${d > 0 ? '+' : '−'}${nf.format(Math.abs(d))}${suffix}`), cls: d > 0 ? 'up' : 'down' };
  }
  function renderTiles() {

    const range = state.days ? T.rangeShort(state.days) : T.rangeAllShort;
    const head = [
      tile(T.subscribers, nf.format(s.totalEmail ?? v30.totalSubscribersEnd ?? 0), deltaOf(v30.totalSubscribersEnd, v30.totalSubscribersStart), 'hero'),

      tile(T.tOpenAvg, pf(openRate), { text: T.ctrAvg(pf(ctr)) }),
      tile(T.tReactionsPer100, dec(aggRate(posts, 'reactions', 'views', ENG_DEN)), { text: T.commentsPer100(dec(aggRate(posts, 'comments', 'views', ENG_DEN))) }),
      tile(T.tSignupsPer1000, dec(aggRate(posts, 'signups', 'views', CONV_DEN)), { text: T.totalSignups(nf.format(sumk('signups'))) }),
    ]) : head.concat([

      tile(T.tViewsPerPostAvg, avg('views') == null ? '—' : nf.format(Math.round(avg('views'))), { text: T.totalViews(nf.format(sumk('views'))) }),
      tile(T.tOpenAvg, pf(openRate), { text: T.ctrAvg(pf(ctr)) }),
      tile(T.tReactionsPerPost, avg('reactions') == null ? '—' : dec(avg('reactions')), { text: T.comments(nf.format(sumk('comments'))) }),
      tile(T.tSignups, nf.format(sumk('signups')), { text: T.unsubs(nf.format(sumk('unsubscribes'))) }),
    ])).join('');
  }

  // ---------- helpers for SVG ----------
  const svgEl = (w, h) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', `0 0 ${w} ${h}`); s.setAttribute('width', w); s.setAttribute('height', h); s.style.width = '100%'; s.style.height = 'auto'; return s; };
  const el = (n, a = {}, txt) => { const e = document.createElementNS('http://www.w3.org/2000/svg', n); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
  const niceTicks = (max, n = 4) => {
    if (!max || !isFinite(max) || max <= 0) return [0];
    const raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
    const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
    const top = Math.ceil(max / step) * step;   // redondea hacia arriba: el eje siempre cubre el dato
    const t = [];
    for (let v = 0; v <= top + 1e-9; v += step) t.push(v);
    return t;
  };
  const width = (id) => Math.max(320, $(id).clientWidth || 600);

  // ---------- subscribers line ----------
  function renderSubs() {
    const p = pub(), box = $('#subs-chart'); box.innerHTML = '';
    let ts = p.subscribers_ts.map(([d, v]) => ({ t: new Date(String(d).replace(/\//g, '-')).getTime(), v })).filter(x => !isNaN(x.t));
    if (state.days) ts = ts.filter(x => x.t >= cutoff());
    $('#subs-sub').textContent = ts.length ? T.fromTo(dfs(ts[0].t), dfs(ts[ts.length - 1].t)) : '';
    $('#subs-table').innerHTML = ts.length ? `<table><thead><tr><th class="t">${T.date}</th><th>${T.subscribers}</th></tr></thead><tbody>${ts.filter((_, i) => i % 7 === 0 || i === ts.length - 1).map(x => `<tr><td class="t">${df(x.t)}</td><td>${nf.format(x.v)}</td></tr>`).join('')}</tbody></table>` : '';
    if (ts.length < 2) { box.innerHTML = `<div class="empty">${T.noSeries}</div>`; return; }
    const W = width('#subs-chart'), H = 220, m = { t: 12, r: 16, b: 28, l: 44 };
    const svg = svgEl(W, H);
    const vmin = Math.min(...ts.map(x => x.v)), vmax = Math.max(...ts.map(x => x.v));
    const lo = Math.max(0, vmin - (vmax - vmin) * 0.3 - 1), ticks = niceTicks(vmax - lo, 4).map(t => t + lo);
    const x = (t) => m.l + (t - ts[0].t) / (ts[ts.length - 1].t - ts[0].t || 1) * (W - m.l - m.r);
    const y = (v) => H - m.b - (v - lo) / ((ticks[ticks.length - 1] || 1) - lo || 1) * (H - m.t - m.b);
    ticks.forEach(t => { svg.appendChild(el('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), class: 'grid-line' })); svg.appendChild(el('text', { x: m.l - 6, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' }, compact(Math.round(t)))); });
    const nx = Math.min(6, ts.length); for (let i = 0; i < nx; i++) { const k = Math.round(i * (ts.length - 1) / (nx - 1 || 1)); svg.appendChild(el('text', { x: x(ts[k].t), y: H - 8, 'text-anchor': i === 0 ? 'start' : i === nx - 1 ? 'end' : 'middle', class: 'tick' }, dfs(ts[k].t))); }
    const path = ts.map((d, i) => `${i ? 'L' : 'M'}${x(d.t).toFixed(1)},${y(d.v).toFixed(1)}`).join(' ');
    svg.appendChild(el('path', { d: `${path} L${x(ts[ts.length - 1].t)},${H - m.b} L${x(ts[0].t)},${H - m.b} Z`, class: 'area' }));
    svg.appendChild(el('line', { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, class: 'axis-line' }));
    svg.appendChild(el('path', { d: path, class: 'line' }));
    const last = ts[ts.length - 1];
    svg.appendChild(el('circle', { cx: x(last.t), cy: y(last.v), r: 4, class: 'dot' }));
    svg.appendChild(el('text', { x: x(last.t) - 8, y: y(last.v) - 8, 'text-anchor': 'end', class: 'dlabel' }, nf.format(last.v)));
    const cross = el('line', { y1: m.t, y2: H - m.b, class: 'crosshair', visibility: 'hidden' }); svg.appendChild(cross);
    const hdot = el('circle', { r: 4, class: 'dot', visibility: 'hidden' }); svg.appendChild(hdot);
    const hit = el('rect', { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, class: 'hit' }); svg.appendChild(hit);
    hit.addEventListener('mousemove', e => { const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) * W / r.width; let best = ts[0]; for (const d of ts) if (Math.abs(x(d.t) - px) < Math.abs(x(best.t) - px)) best = d; cross.setAttribute('x1', x(best.t)); cross.setAttribute('x2', x(best.t)); cross.setAttribute('visibility', 'visible'); hdot.setAttribute('cx', x(best.t)); hdot.setAttribute('cy', y(best.v)); hdot.setAttribute('visibility', 'visible'); showTip(`<b>${df(best.t)}</b>${nf.format(best.v)} ${T.uSubscribers}`, e.clientX, e.clientY); });
    hit.addEventListener('mouseleave', () => { cross.setAttribute('visibility', 'hidden'); hdot.setAttribute('visibility', 'hidden'); hideTip(); });
    box.appendChild(svg);
  }

      svg.appendChild(el('path', { d: `M${m.l},${yy + 3} h${Math.max(0, w - 4)} a4,4 0 0 1 4,4 v8 a4,4 0 0 1 -4,4 h${-Math.max(0, w - 4)} z`, class: 'bar' }));

  // ---------- views per post (columns, chronological) ----------
  function renderViews() {
    const box = $('#views-chart'); box.innerHTML = '';
    const posts = filtered().slice().sort((a, b) => new Date(a.date) - new Date(b.date));
    const rel = isRel();
    const mv = (p) => rel ? relOf(p).views_rel : p.views;
    const fmtv = (v) => v == null ? '—' : rel ? dec(v) : nf.format(Math.round(v));
    const avgTxt = posts.length ? (isRel() ? aggRate(posts, 'views', 'delivered', REACH_DEN) : posts.reduce((a, x) => a + x.views, 0) / posts.length) : null;
    const avgLbl = avgTxt == null ? '' : T.greyLineAvg(rel ? dec(avgTxt) : nf.format(Math.round(avgTxt)));
    $('#views-sub').textContent = posts.length ? (rel
      ? T.chrono(posts.length) + T.viewsPer100Explain + avgLbl
      : T.chrono(posts.length) + avgLbl + T.topThreeNote) : '';
    $('#views-legend').innerHTML = posts.length ? `<span><i style="background:var(--s1)"></i>${rel ? T.viewsPer100 : T.legendPostViews}</span><span><i style="background:var(--s2)"></i>${T.legendTop3}</span>` : '';
    if (!posts.length) { box.innerHTML = `<div class="empty">${T.noPostsRange}</div>`; return; }
    const top3 = new Set(posts.slice().sort((a, b) => (mv(b) ?? -1) - (mv(a) ?? -1)).slice(0, 3).map(p => p.id));
    const W = width('#views-chart'), H = 240, m = { t: 12, r: 12, b: 30, l: 44 };
    const svg = svgEl(W, H);
    const max = Math.max(...posts.map(p => mv(p) ?? 0), rel ? 0.1 : 1), ticks = niceTicks(max, 4), tmax = ticks[ticks.length - 1] || max;
    const y = (v) => H - m.b - v / tmax * (H - m.t - m.b);
    ticks.forEach(t => { svg.appendChild(el('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), class: 'grid-line' })); svg.appendChild(el('text', { x: m.l - 6, y: y(t) + 4, 'text-anchor': 'end', class: 'tick' }, rel ? dec(t, tmax < 10 ? 1 : 0) : compact(t))); });
    svg.appendChild(el('line', { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, class: 'axis-line' }));
    const slot = (W - m.l - m.r) / posts.length, bw = Math.min(24, Math.max(3, slot - 2));
    const avg = rel ? aggRate(posts, 'views', 'delivered', REACH_DEN) : posts.reduce((a, p) => a + p.views, 0) / posts.length;
    if (avg != null) svg.appendChild(el('line', { x1: m.l, x2: W - m.r, y1: y(avg), y2: y(avg), class: 'axis-line', stroke: 'var(--muted)' }));
    posts.forEach((p, i) => {
      const v = mv(p) ?? 0;
      const cx = m.l + slot * i + slot / 2, x0 = cx - bw / 2, h = Math.max(0, (H - m.b) - y(v));

      if (h > 0) svg.appendChild(el('path', { d: `M${x0},${H - m.b} v${-(h - rr)} a${rr},${rr} 0 0 1 ${rr},${-rr} h${bw - 2 * rr} a${rr},${rr} 0 0 1 ${rr},${rr} v${h - rr} z`, class: 'bar' + (top3.has(p.id) ? ' hi' : '') }));
      if (top3.has(p.id) && bw >= 10 && h > 0) svg.appendChild(el('text', { x: cx, y: y(v) - 5, 'text-anchor': 'middle', class: 'dlabel' }, fmtv(mv(p))));
      const hit = el('rect', { x: m.l + slot * i, y: m.t, width: slot, height: H - m.t - m.b, class: 'hit' }); svg.appendChild(hit);
      const rp = relOf(p);
      hit.addEventListener('mousemove', e => showTip(`<b>${esc(p.title)}</b>${df(p.date)}<br>${nf.format(p.views)} ${T.uViews}${p.delivered ? T.perHundredSubs(dec(rp.views_rel), nf.format(p.delivered)) : ' · ' + T.notEmailed}<br>${T.tipOpen(p.delivered ? pf(p.open_rate) : '—')} · ${T.tipReactions(p.reactions, dec(rp.reactions_rel))}`, e.clientX, e.clientY));

    const nx = Math.min(6, posts.length); for (let i = 0; i < nx; i++) { const k = Math.round(i * (posts.length - 1) / (nx - 1 || 1)); svg.appendChild(el('text', { x: m.l + slot * k + slot / 2, y: H - 8, 'text-anchor': 'middle', class: 'tick' }, dfs(posts[k].date))); }

  const cellOf = (p, key) => {

    if (key === 'open_rate' || key === 'ctr') return `<td>${p.delivered ? pf(p[key]) : '—'}</td>`;
    if (REL_KEYS.has(key)) return `<td>${dec(p[key])}</td>`;

    const { key, dir } = state.sort;
    posts.sort((a, b) => { let va = a[key], vb = b[key]; if (key === 'title') { va = (va || '').toLowerCase(); vb = (vb || '').toLowerCase(); return dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va); } if (key === 'date') { va = new Date(a.date); vb = new Date(b.date); } va = va ?? -Infinity; vb = vb ?? -Infinity; return dir === 'asc' ? va - vb : vb - va; });

  // ---------- detail ----------
  // El detalle se despliega como una fila justo debajo del post pulsado. Antes vivía en una
  // tarjeta al final de la página: con muchos posts el clic parecía no hacer nada.
  function openDetail(id, scroll) {
    state.selected = id;
    renderTable();
    if (scroll && id != null) {
      const row = $(`#posts tbody tr[data-id="${id}"]`);
      if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function detailHtml(p) {
    const vs = vsOf(p), r = relOf(p);
    const stat = (l, v, n) => `<div class="dstat"><div class="l">${l}</div><div class="v">${v}</div>${n ? `<div class="n">${n}</div>` : ''}</div>`;
    const tags = [p.audience === 'only_paid' ? T.audPaid : T.audEveryone, p.type !== 'newsletter' ? p.type : null].filter(Boolean).join(' · ');
    const refs = (p.referrers || []).slice(0, 6);
    const links = (p.links || []).slice(0, 6);
    const daily = p.daily || [];
    return `
      <div class="dhead">
        <div>
          <h3><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a></h3>
          <div class="sub">${df(p.date)} · ${esc(tags)}</div>
        </div>
        <button class="btn" id="detail-close">${T.close}</button>
      </div>
      <div class="dstats">${[
        stat(T.mViews, nf.format(p.views), vs == null ? T.deliveredN(nf.format(p.delivered)) : T.vsComparables(pctSigned(vs))),
        stat(T.mOpen, p.delivered ? pf(p.open_rate) : '—', p.delivered ? T.ofN(nf.format(p.opened), nf.format(p.delivered)) : T.notEmailed),
        stat('CTR', p.delivered ? pf(p.ctr) : '—', T.uniqueClicks(nf.format(p.clicked))),
        stat(T.mReactions, nf.format(p.reactions), T.commentsShares(nf.format(p.comments), nf.format(p.shares))),
        stat(T.mSignups, nf.format(p.signups), T.signupsNote(p.signups_1d, p.unsubscribes)),
      ].join('')}</div>
      <div class="dcaption">${T.normalisedCaption}</div>
      <div class="dstats">${[
        stat(T.dViewsPer100, dec(r.views_rel), T.reachOverSend),
        stat(T.dReactionsPer100, dec(r.reactions_rel), T.engagementOverReach),
        stat(T.dSignupsPer1000, dec(r.signups_rel), T.conversionOverTraffic),
        p.comps ? stat(T.dComparable, nf.format(Math.round(p.comps.views || 0)), T.comparableNote(pf(p.comps.open_rate), p.comps.n)) : '',
      ].join('')}</div>
      <hr class="dsep">
      <div class="dcols">
        <section>
          <h4>${T.secSources}</h4>
          ${refs.length ? refs.map(s => { const pct = Math.max(0, Math.min(1, +s.percent_of_total_views || 0)); return `<div class="srcrow"><div class="t"><span>${esc(s.source)}</span><span>${nf.format(s.views)} · ${pf(pct, 0)}</span></div><div class="srcbar"><i style="width:${(pct * 100).toFixed(1)}%"></i></div></div>`; }).join('') : `<div class="dempty">${T.noOrigin}</div>`}
        </section>
        <section>
          <h4>${T.secWeek}</h4>
          ${daily.length ? '<div id="daily-chart"></div>' : `<div class="dempty">${T.noDaily}</div>`}
        </section>
        <section>
          <h4>${T.secLinks}</h4>
          ${links.length ? links.map(([u, c]) => `<div class="linkrow"><span title="${esc(u)}">${esc(String(u).replace(/^https?:\/\//, ''))}</span><span>${nf.format(c)}</span></div>`).join('') : `<div class="dempty">${T.noClicks}</div>`}
        </section>
      </div>`
  }

  function wireDetail() {
    const closeBtn = $('#detail-close');
    if (!closeBtn) return;
    closeBtn.onclick = () => openDetail(null);
    const p = pub().posts.find(x => x.id === state.selected);
    const daily = p ? (p.daily || []) : [];
    if (daily.length && $('#daily-chart')) {
      const W = width('#daily-chart'), H = 140, m = { t: 18, r: 4, b: 22, l: 4 }, max = Math.max(...daily.map(d => d.views), 1);
      const svg = svgEl(W, H), slot = (W - m.l - m.r) / daily.length, bw = Math.min(26, slot - 8), y = (v) => H - m.b - v / max * (H - m.t - m.b);
      svg.appendChild(el('line', { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, class: 'axis-line' }));
      daily.forEach((d, i) => {
        const x0 = m.l + slot * i + (slot - bw) / 2, h = (H - m.b) - y(d.views), rr = Math.min(4, bw / 2, h);
        if (h > 0) svg.appendChild(el('path', { d: `M${x0},${H - m.b} v${-(h - rr)} a${rr},${rr} 0 0 1 ${rr},${-rr} h${bw - 2 * rr} a${rr},${rr} 0 0 1 ${rr},${rr} v${h - rr} z`, class: 'bar' }));
        svg.appendChild(el('text', { x: x0 + bw / 2, y: H - 7, 'text-anchor': 'middle', class: 'tick' }, 'd' + i));
        svg.appendChild(el('text', { x: x0 + bw / 2, y: y(d.views) - 6, 'text-anchor': 'middle', class: 'dlabel' }, nf.format(d.views)));
      });
      $('#daily-chart').appendChild(svg);
    }
  }

  addEventListener('resize', () => { if (state.pub === -1) renderCompare(); else { renderSubs(); renderSources(); renderViews(); } });
  render();
})();
</script>
</body>
</html>
