<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
  body { width: 320px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, -apple-system, sans-serif; color: #0b0b0b; background: #fcfcfb; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  button { width: 100%; border: 0; border-radius: 8px; padding: 9px 12px; font: inherit; font-weight: 600; color: #fff; background: #ff6719; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: default; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row button.secondary { background: #e9e8e3; color: #0b0b0b; font-weight: 500; }
  #status { margin-top: 10px; color: #52514e; white-space: pre-wrap; max-height: 220px; overflow: auto; font-size: 12px; }
  #status.err { color: #d03b3b; }
  .hint { margin-top: 10px; font-size: 11px; color: #898781; }
</style></head>
<body>
  <h1>Panel Substack</h1>
  <button id="sync">Sincronizar todas las publicaciones</button>
  <div class="row"><button id="open" class="secondary">Abrir el panel</button></div>
  <div id="status"></div>
  <div class="hint">Usa tu sesión de Substack en este Chrome. El servidor del panel debe estar en marcha (npm start).</div>
  <script src="popup.js"></script>
</body></html>
